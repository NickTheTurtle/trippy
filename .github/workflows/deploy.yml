name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Require main branch for manual deploys
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "Manual deploys must be run from refs/heads/main, not ${{ github.ref }}."
          exit 1

      - name: Require successful CI
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "CI concluded with ${{ github.event.workflow_run.conclusion }}. Refusing to deploy."
          exit 1

      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${AWS_REGION}" ]]; then
            echo "Missing repository variable AWS_REGION." >&2
            missing=1
          fi
          if [[ -z "${EC2_INSTANCE_ID}" ]]; then
            echo "Missing repository variable EC2_INSTANCE_ID." >&2
            missing=1
          fi
          if [[ -z "${AWS_DEPLOY_ROLE_ARN}" ]]; then
            echo "Missing repository secret AWS_DEPLOY_ROLE_ARN." >&2
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run deploy script over SSM
        run: |
          set -euo pipefail

          command_id="$(
            aws ssm send-command \
              --instance-ids "${EC2_INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy ${GITHUB_SHA} from GitHub Actions" \
              --parameters 'commands=["bash /opt/trippy/deploy/update.sh"]' \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "Started SSM command ${command_id}."

          deadline=$((SECONDS + 2400))
          status="Pending"
          while true; do
            set +e
            status_output="$(
              aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query 'Status' \
                --output text 2>&1
            )"
            status_rc=$?
            set -e

            if [[ "${status_rc}" -ne 0 ]]; then
              echo "Waiting for command invocation to become visible: ${status_output}"
            else
              status="${status_output}"
              echo "SSM command status: ${status}"
              case "${status}" in
                Pending|InProgress|Delayed)
                  ;;
                Success|Cancelled|TimedOut|Failed|Cancelling)
                  break
                  ;;
                *)
                  echo "Unknown SSM command status: ${status}" >&2
                  break
                  ;;
              esac
            fi

            if (( SECONDS >= deadline )); then
              echo "Timed out waiting for SSM command ${command_id}." >&2
              exit 1
            fi
            sleep 15
          done

          echo "::group::Remote stdout"
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text || true
          echo "::endgroup::"

          echo "::group::Remote stderr"
          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardErrorContent' \
            --output text || true
          echo "::endgroup::"

          response_code="$(
            aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'ResponseCode' \
              --output text
          )"

          if [[ "${status}" != "Success" || "${response_code}" != "0" ]]; then
            echo "Deploy failed. SSM status=${status}, response code=${response_code}." >&2
            exit 1
          fi

          echo "Deploy completed successfully."
